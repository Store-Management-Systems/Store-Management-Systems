<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Shop Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- App Main View -->
<div id="app" style="display:none;">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo" id="topbarLogo">SMS</div>
    <div class="topbar-title" id="topbarTitle">Shop Management System</div>
    
    <div id="topbarAdminShopSelect" style="display:none;margin-right:4px;">
      <select id="adminShopDropdown" onchange="handleAdminShopSwitch(this.value)" style="padding:4px 8px;font-size:12px;max-width:130px;background:#fff;border-radius:8px;">
      </select>
    </div>

    <button onclick="openReportsModal()" title="Reports & Reports Export" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;">📊</button>
    <button onclick="showSection('settings')" title="Settings" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;">⚙</button>
    <button onclick="handleLogout()" title="Logout" style="background:rgba(239,68,68,.3);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;">🚪</button>
  </div>

  <!-- Content Render Area -->
  <div class="content" id="mainContent"></div>

  <!-- Bottom Navigation -->
  <div class="bottomnav" id="bottomNav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')">
      <span class="nav-icon">📊</span>Dashboard
    </button>
    <button class="nav-btn" id="nav-stock" onclick="showSection('stock')">
      <span class="nav-icon">📦</span>Stock
    </button>
    <button class="nav-btn" id="nav-bill" onclick="showSection('bill')">
      <span class="nav-icon">🧾</span>Bill
    </button>
    <button class="nav-btn" id="nav-history" onclick="showSection('history')">
      <span class="nav-icon">📋</span>History
    </button>
  </div>
</div>

<!-- Login Overlay Screen -->
<div id="loginScreen" class="login-overlay">
  <div class="login-card fade-in">
    <div class="login-logo" id="loginLogo">SMS</div>
    <h2 class="login-title" id="loginShopName">Shop Management System</h2>
    <p class="login-subtitle">Sign in to access your dashboard</p>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" id="loginUsername" placeholder="e.g. admin" value="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" id="loginPassword" placeholder="••••••••" value="admin123" required autocomplete="current-password">
          <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:12px;padding:4px;">👁 Show</button>
        </div>
      </div>
      
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:var(--text-muted);">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="rememberMe" checked style="width:auto;"> Remember Me
        </label>
        <span style="color:var(--accent);cursor:pointer;" onclick="alert('Please contact your administrator to reset your password.')">Forgot Password?</span>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;padding:12px;font-size:15px;">🔐 Sign In</button>
    </form>
    
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-light);">
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Thermal Print Area (Hidden) -->
<div id="printArea" class="print-area" style="display:none;"></div>

<script src="script.js"></script>
</body>
</html>
