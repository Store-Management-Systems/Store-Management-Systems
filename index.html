<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>STORE MANAGEMENT SYSTEMS — B2B & B2C Enterprise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</head>

<body>

  <!-- Main Application UI -->
  <div id="app" style="display:none;">
    <!-- Apple Frosted Glass Top Bar -->
    <div class="topbar">
      <div class="topbar-logo" id="topbarLogo"><img src="logo.png" alt="logo"></div>
      <div class="topbar-title" id="topbarTitle">STORE MANAGEMENT SYSTEMS</div>

      <div id="topbarAdminShopSelect" style="display:none;margin-right:4px;">
        <select id="adminShopDropdown" onchange="handleAdminShopSwitch(this.value)"
          style="padding:6px 12px;font-size:12px;max-width:140px;background:rgba(255,255,255,0.15);color:#fff;border-radius:10px;border:1px solid rgba(255,255,255,0.2);">
        </select>
      </div>

      <button onclick="openApprovalsModal()" id="btnTopApprovals" title="Pending Approvals (8h Auto-Approval)"
        style="background:rgba(255,149,0,0.3);border:none;color:#fff;padding:0 10px;height:36px;border-radius:18px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">
        🛡 Approvals
      </button>
      <button onclick="openReportsModal()" title="Export Reports"
        style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;">📊</button>
      <button onclick="showSection('settings')" title="Shop Settings"
        style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;">⚙</button>
      <button onclick="handleLogout()" title="Logout"
        style="background:rgba(255,59,48,0.3);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;">🚪</button>
    </div>

    <!-- Content Section -->
    <div class="content" id="mainContent"></div>

    <!-- iOS Floating Bottom Navigation Bar -->
    <div class="bottomnav" id="bottomNav">
      <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')">
        <span class="nav-icon">📊</span>Dashboard
      </button>
      <button class="nav-btn" id="nav-people" onclick="showSection('people')">
        <span class="nav-icon">👥</span>People
      </button>
      <button class="nav-btn" id="nav-stock" onclick="showSection('stock')">
        <span class="nav-icon">📦</span>Stock
      </button>
      <button class="nav-btn" id="nav-bill" onclick="showSection('bill')">
        <span class="nav-icon">🧾</span>Bill
      </button>
      <button class="nav-btn" id="nav-analytics" onclick="showSection('analytics')">
        <span class="nav-icon">📈</span>Analytics
      </button>
      <button class="nav-btn" id="nav-history" onclick="showSection('history')">
        <span class="nav-icon">📋</span>History
      </button>
    </div>
  </div>

  <!-- Apple Frosted Glass Login Overlay Screen -->
  <div id="loginScreen" class="login-overlay">
    <div class="login-card fade-in">
      <div class="login-logo" id="loginLogo"><img src="logo.png" alt="logo"></div>
      <h2 class="login-title" id="loginShopName">STORE MANAGEMENT SYSTEMS</h2>
      <p class="login-subtitle">Sign in with your store credentials to continue</p>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" id="loginUsername" placeholder="" value="" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="loginPassword" placeholder="••••••••" value="" required
              autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility()"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);font-size:12px;padding:4px;font-weight:600;">👁
              Show</button>
          </div>
        </div>

        <div
          style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;color:var(--text-secondary);">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="rememberMe" checked style="width:auto;accent-color:var(--ios-blue);"> Remember Me
          </label>
          <span style="color:var(--ios-blue);cursor:pointer;font-weight:600;"
            onclick="alert('Please contact your store administrator to reset your password.')">Forgot Password?</span>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;padding:14px;font-size:16px;">🔐 Sign
          In</button>
      </form>

      <div
        style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border-light);font-size:12px;color:var(--text-secondary);">
        <strong style="color:var(--ios-blue);"></strong> Contact support: 9090684957 <strong
          style="color:var(--ios-blue);"></strong>
      </div>
    </div>
  </div>

  <!-- iOS Sheet Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Thermal Print Area (Hidden) -->
  <div id="printArea" class="print-area" style="display:none;"></div>

  <script src="script.js"></script>
</body>

</html>
