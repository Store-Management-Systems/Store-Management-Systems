<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FAFAF8">
  <title>STORE MANAGEMENT SYSTEMS — Mobile PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=2.2.0">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.update();
          }
        });
        navigator.serviceWorker.register('/sw.js?v=2.2.0').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</head>

<body>

  <!-- Floating Toast Notifications Container -->
  <div id="toastContainer"></div>

  <!-- Mobile PWA Application Viewport Container (Max 430px) -->
  <div id="app" style="display:none;">

    <!-- Sticky Mobile Top App Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="currentSectionTitle">Dashboard</span>
      </div>

      <div class="topbar-right">
        <!-- Quick Search -->
        <button class="topbar-btn" onclick="openMobileGlobalSearch()" title="Search">🔍</button>

        <!-- Reports Export Modal -->
        <button class="topbar-btn" onclick="openReportsModal()" title="Export Reports">📊</button>

        <!-- User Profile Avatar Pill -->
        <div class="user-profile-avatar" id="userAvatarCircle" onclick="handleLogout()" title="Click to Sign Out">A</div>
      </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="content" id="mainContent"></main>

    <!-- Fixed Mobile Bottom Navigation Bar -->
    <nav class="bottomnav" id="bottomNav">
      <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')">
        <span class="nav-icon">📊</span>Dashboard
      </button>
      <button class="nav-btn" id="nav-analytics" onclick="showSection('analytics')">
        <span class="nav-icon">📈</span>Analytics
      </button>
      <button class="nav-btn" id="nav-bill" onclick="showSection('bill')">
        <span class="nav-icon">🧾</span>Orders
      </button>
      <button class="nav-btn" id="nav-stock" onclick="showSection('stock')">
        <span class="nav-icon">📦</span>Stock
      </button>
      <button class="nav-btn" id="nav-settings" onclick="showSection('settings')">
        <span class="nav-icon">⚙️</span>Settings
      </button>
    </nav>

  </div>

  <!-- Mobile Login Screen -->
  <div id="loginScreen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg-main);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;">
    <div style="width:100%;max-width:380px;background:#FFFFFF;border-radius:24px;padding:28px 20px;border:1px solid var(--border-light);box-shadow:var(--shadow-float);text-align:center;">
      <div style="margin-bottom:16px;" id="loginLogo">
        <img src="assets/logos/logo.png" alt="STORE SYSTEMS Logo" style="width:64px;height:64px;object-fit:contain;border-radius:16px;">
      </div>
      <h2 style="font-size:20px;font-weight:800;margin-bottom:4px;color:var(--text-primary);" id="loginShopName">STORE SYSTEMS</h2>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:24px;">Mobile SaaS ERP</p>

      <form id="loginForm" action="javascript:void(0);" onsubmit="handleLoginSubmit(event); return false;" style="text-align:left;">
        <div style="margin-bottom:14px;">
          <label class="form-label" for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="username" class="form-control" placeholder="Enter username" required autocomplete="username" autofocus>
        </div>

        <div style="margin-bottom:14px;">
          <label class="form-label" for="loginPassword">Password</label>
          <div style="position:relative;">
            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Show password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-secondary);">
              <span id="togglePasswordIcon">👁</span>
            </button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:12px;color:var(--text-secondary);">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="rememberMe" checked style="accent-color:var(--accent-dark);"> Remember Me
          </label>
          <span style="color:var(--accent-blue);cursor:pointer;font-weight:700;" onclick="showToast('Password Reset', 'Ask your Admin or Owner to reset password.', 'info')">Forgot?</span>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;height:48px;font-size:15px;border-radius:14px;">
          🔐 Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Reusable Mobile Bottom-Sheet Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal-container" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Thermal Print Container (Hidden) -->
  <div id="printArea" class="print-area" style="display:none;"></div>

  <script src="script.js?v=2.2.0"></script>
</body>

</html>
