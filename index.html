<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#000000">
<title>Shop Management System</title>
<link rel="manifest" href="#" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo" id="topbarLogo">SMS</div>
    <div class="topbar-title" id="topbarTitle">Shop Management System</div>
    <button onclick="showSection('settings')" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;">⚙</button>
  </div>

  <!-- Content -->
  <div class="content" id="mainContent"></div>

  <!-- Bottom Nav -->
  <div class="bottomnav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')">
      <span class="nav-icon">📊</span>Dashboard
    </button>
    <button class="nav-btn" id="nav-stock" onclick="showSection('stock')">
      <span class="nav-icon">📦</span>Stock
    </button>
    <button class="nav-btn" id="nav-bill" onclick="showSection('bill')">
      <span class="nav-icon">🧾</span>Bill
    </button>
    <button class="nav-btn" id="nav-history" onclick="showSection('history')">
      <span class="nav-icon">📋</span>History
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Print area (hidden) -->
<div id="printArea" class="print-area" style="display:none;"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let state = {
  shop: {
    name: 'My Shop',
    tagline: 'Shop Now! or Never',
    address: '123 Wall Street',
    phone: '9876543210',
    gst: '',
    logo: null,
    currency: '₹',
    taxRate: 0,
    lowStockAlert: 2
  },
  items: [],
  bills: [],
  logs: [],
  categories: [], // Dynamic Categories
  units: [], // Dynamic Units
  nextBillNo: 1001
};

// Load from localStorage
function loadState(){
  try{
    const saved = localStorage.getItem('shop_state');
    if(saved) state = {...state, ...JSON.parse(saved)};
    
    // Fallbacks and Migrations
    if(!state.items) state.items = [];
    if(!state.bills) state.bills = [];
    if(!state.logs) state.logs = [];
    if(!state.nextBillNo) state.nextBillNo = 1001;
    
    // Initialize default categories if none exist
    if(!state.categories || state.categories.length === 0) {
      state.categories = ['Others'];
    }

    // Initialize default units if none exist
    if(!state.units || state.units.length === 0) {
      state.units = [];
    }

    // Migrate old items: Ensure buyPrice exists, cleanup emojis, backwards compatibility for units
    state.items.forEach(i => {
      if (!('buyPrice' in i)) i.buyPrice = 0;
      if ('emoji' in i) delete i.emoji;
      
      // Auto-add unknown units to the dynamic list
      if (i.unit && !state.units.some(u => u.toLowerCase() === i.unit.toLowerCase())) {
        state.units.push(i.unit);
      }
    });

  }catch(e){}
}

function saveState(){
  localStorage.setItem('shop_state', JSON.stringify(state));
}

loadState();

// ─── Navigation ──────────────────────────────────────────────────────────────
let currentSection = 'dashboard';

function showSection(name){
  currentSection = name;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + name);
  if(nb) nb.classList.add('active');
  renderSection(name);
}

function renderSection(name){
  const c = document.getElementById('mainContent');
  c.innerHTML = '';
  switch(name){
    case 'dashboard': renderDashboard(c); break;
    case 'stock': renderStock(c); break;
    case 'bill': renderBill(c); break;
    case 'history': renderHistory(c); break;
    case 'settings': renderSettings(c); break;
  }
  updateTopbar();
}

function updateTopbar(){
  const logo = document.getElementById('topbarLogo');
  const title = document.getElementById('topbarTitle');
  title.textContent = state.shop.name;
  if(state.shop.logo){
    logo.innerHTML = `<img src="${state.shop.logo}" alt="logo">`;
  } else {
    logo.innerHTML = 'SMS';
  }
}

// ─── Dashboard ───────────────────────────────────────────────────────────────
function renderDashboard(c){
  const totalItems = state.items.length;
  const lowStock = state.items.filter(i => i.qty <= state.shop.lowStockAlert).length;
  const todayBills = state.bills.filter(b => {
    const d = new Date(b.date); const now = new Date();
    return d.toDateString() === now.toDateString();
  });
  const todayRevenue = todayBills.reduce((s,b) => s + b.total, 0);
  const totalRevenue = state.bills.reduce((s,b) => s + b.total, 0);

  c.innerHTML = `
  <div class="fade-in">
    ${lowStock > 0 ? `<div class="alert alert-warn">⚠ ${lowStock} item${lowStock>1?'s':''} running low on stock!</div>` : ''}
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${totalItems}</div>
        <div class="stat-label">Total Items</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:${lowStock>0?'var(--text)':'var(--success)'};">${lowStock}</div>
        <div class="stat-label">Low Stock</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${state.shop.currency}${todayRevenue.toFixed(0)}</div>
        <div class="stat-label">Today's Revenue</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${todayBills.length}</div>
        <div class="stat-label">Today's Bills</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Quick Actions</h3>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn-primary" onclick="showSection('bill')" style="padding:14px;font-size:14px;">🧾 New Bill</button>
        <button class="btn-secondary" onclick="openAddItem()" style="padding:14px;font-size:14px;">➕ Add Item</button>
        <button class="btn-secondary" onclick="openStockIn()" style="padding:14px;font-size:14px;">📥 Stock In</button>
        <button class="btn-secondary" onclick="openStockOut()" style="padding:14px;font-size:14px;">📤 Stock Out</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Recent Bills</h3></div>
      ${state.bills.length === 0 ? '<div class="empty-state" style="padding:20px"><p>No bills yet</p></div>' :
        state.bills.slice(-5).reverse().map(b => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
            <div>
              <div style="font-size:14px;font-weight:600;">#${b.billNo}</div>
              <div style="font-size:11px;color:var(--text-muted);">${b.customerName||'Walk-in'} · ${formatDate(b.date)}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:15px;font-weight:700;color:var(--brown);">${state.shop.currency}${b.total.toFixed(2)}</div>
              <button class="btn-sm btn-secondary" onclick="viewBill('${b.id}')" style="margin-top:4px;">View</button>
            </div>
          </div>
        `).join('')
      }
    </div>

    ${state.items.filter(i => i.qty <= state.shop.lowStockAlert).length > 0 ? `
    <div class="card">
      <div class="card-header"><h3>⚠ Low Stock Items</h3></div>
      ${state.items.filter(i => i.qty <= state.shop.lowStockAlert).map(i => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);">
          <div style="font-size:14px;">📦 ${i.name}</div>
          <span class="badge badge-danger">${i.qty} ${i.unit}</span>
        </div>
      `).join('')}
    </div>` : ''}
  </div>`;
}

// ─── Stock ───────────────────────────────────────────────────────────────────
let stockTab = 'all', stockSearch = '';

function renderStock(c){
  const filtered = state.items.filter(i =>
    i.name.toLowerCase().includes(stockSearch.toLowerCase())
  );

  c.innerHTML = `
  <div class="fade-in">
    <div class="tabs">
      <button class="tab ${stockTab==='all'?'active':''}" onclick="setStockTab('all')">All Items</button>
      <button class="tab ${stockTab==='in'?'active':''}" onclick="setStockTab('in')">Stock In</button>
      <button class="tab ${stockTab==='out'?'active':''}" onclick="setStockTab('out')">Stock Out</button>
    </div>

    ${stockTab==='all' ? renderAllStock(filtered) : ''}
    ${stockTab==='in' ? renderStockInForm() : ''}
    ${stockTab==='out' ? renderStockOutForm() : ''}
  </div>`;
}

function setStockTab(t){ stockTab = t; renderSection('stock'); }

function renderAllStock(items){
  return `
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search items..." value="${stockSearch}" oninput="stockSearch=this.value;renderSection('stock')">
    </div>
    <button class="btn-primary" style="width:100%;margin-bottom:12px;" onclick="openAddItem()">➕ Add New Item</button>
    ${items.length === 0 ? `<div class="empty-state"><div class="empty-state-icon">📦</div><p>No items found. Add your first item!</p></div>` :
      items.map(item => `
        <div class="stock-item ${item.qty <= state.shop.lowStockAlert ? 'low-stock' : 'ok-stock'}">
          <div class="stock-icon">📦</div>
          <div class="stock-info">
            <div class="stock-name">${item.name}</div>
            <div class="stock-meta">Sell: ${state.shop.currency}${item.price.toFixed(2)} · ${item.category||'General'}</div>
          </div>
          <div class="stock-qty">
            <div class="qty-num">${item.qty}</div>
            <div class="qty-unit">${item.unit}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <button class="btn-sm btn-secondary" onclick="openEditItem('${item.id}')">✏</button>
            <button class="btn-sm" style="background:var(--danger);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;" onclick="deleteItem('${item.id}')">🗑</button>
          </div>
        </div>
      `).join('')
    }
  `;
}

function renderStockInForm(){
  return `
    <div class="card">
      <h3 style="margin-bottom:14px;">📥 Stock In</h3>
      <div class="form-group">
        <label class="form-label">Select Item</label>
        <select id="siItem">
          <option value="">Choose item...</option>
          ${state.items.map(i => `<option value="${i.id}">📦 ${i.name} (${i.qty} ${i.unit})</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Quantity</label>
          <input type="number" id="siQty" placeholder="0" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Supplier (optional)</label>
          <input type="text" id="siSupplier" placeholder="Supplier name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <input type="text" id="siNotes" placeholder="e.g. Morning delivery">
      </div>
      <button class="btn-success" style="width:100%;" onclick="doStockIn()">✅ Confirm Stock In</button>
    </div>
  `;
}

function renderStockOutForm(){
  return `
    <div class="card">
      <h3 style="margin-bottom:14px;">📤 Stock Out</h3>
      <div class="form-group">
        <label class="form-label">Select Item</label>
        <select id="soItem">
          <option value="">Choose item...</option>
          ${state.items.map(i => `<option value="${i.id}">📦 ${i.name} (${i.qty} ${i.unit})</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Quantity</label>
          <input type="number" id="soQty" placeholder="0" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Reason</label>
          <select id="soReason">
            <option>Sold</option>
            <option>Damaged</option>
            <option>Expired</option>
            <option>Used in production</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <input type="text" id="soNotes" placeholder="Additional notes...">
      </div>
      <button class="btn-danger" style="width:100%;" onclick="doStockOut()">📤 Confirm Stock Out</button>
    </div>
  `;
}

function doStockIn(){
  const itemId = document.getElementById('siItem').value;
  const qty = parseFloat(document.getElementById('siQty').value);
  if(!itemId){ alert('Please select an item'); return; }
  if(!qty || qty <= 0){ alert('Enter a valid quantity'); return; }
  const item = state.items.find(i => i.id === itemId);
  item.qty = parseFloat((item.qty + qty).toFixed(3));
  state.logs.push({id:uid(),type:'in',itemId,itemName:item.name,qty,supplier:document.getElementById('siSupplier').value,notes:document.getElementById('siNotes').value,date:new Date().toISOString()});
  saveState();
  toast(`✅ Added ${qty} ${item.unit} of ${item.name}`);
  renderSection('stock');
}

function doStockOut(){
  const itemId = document.getElementById('soItem').value;
  const qty = parseFloat(document.getElementById('soQty').value);
  if(!itemId){ alert('Please select an item'); return; }
  if(!qty || qty <= 0){ alert('Enter a valid quantity'); return; }
  const item = state.items.find(i => i.id === itemId);
  if(qty > item.qty){ alert(`Only ${item.qty} ${item.unit} available`); return; }
  item.qty = parseFloat((item.qty - qty).toFixed(3));
  state.logs.push({id:uid(),type:'out',itemId,itemName:item.name,qty,reason:document.getElementById('soReason').value,notes:document.getElementById('soNotes').value,date:new Date().toISOString()});
  saveState();
  toast(`📤 Removed ${qty} ${item.unit} of ${item.name}`);
  renderSection('stock');
}

// ─── Dynamic Dropdown Handlers ────────────────────────────────────────────────
function getCategoryOptions(selectedCat) {
  let html = state.categories.map(c => `<option ${c===selectedCat ? 'selected' : ''}>${c}</option>`).join('');
  html += `<option value="Box">+ Add New Category</option>`;
  return html;
}

function handleCatChange(sel) {
  if (sel.value === 'Box') {
    let newCat = prompt("Enter new category name:");
    if (newCat && newCat.trim() !== '') {
      newCat = newCat.trim();
      if (!state.categories.includes(newCat)) {
        state.categories.push(newCat);
        saveState();
      }
      sel.innerHTML = getCategoryOptions(newCat);
      sel.value = newCat;
    } else {
      sel.value = sel.dataset.prev || state.categories[0];
    }
  } else {
    sel.dataset.prev = sel.value;
  }
}

function getUnitOptions(selectedUnit) {
  let html = state.units.map(u => `<option ${u===selectedUnit ? 'selected' : ''}>${u}</option>`).join('');
  html += `<option value="Box">+ Add New Unit</option>`;
  return html;
}

function handleUnitChange(sel) {
  if (sel.value === 'Box') {
    // Create inline mini-modal for adding a new unit
    const overlay = document.createElement('div');
    overlay.style = "position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;";
    
    overlay.innerHTML = `
      <div class="card fade-in" style="width:100%;max-width:320px;margin:0;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,0.5);">
        <h3 style="margin-bottom:16px;text-align:center;">Add New Unit</h3>
        <div class="form-group">
          <label class="form-label">Unit Name</label>
          <input type="text" id="newUnitInput" placeholder="Unit name" maxlength="20">
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
          <button class="btn-primary" style="flex:1;" id="saveUnitBtn">Save</button>
          <button class="btn-secondary" style="flex:1;" id="cancelUnitBtn">Cancel</button>
        </div>
      </div>
    `;
    
    document.body.appendChild(overlay);
    
    const input = document.getElementById('newUnitInput');
    input.focus();

    const closeOverlay = () => document.body.removeChild(overlay);

    document.getElementById('cancelUnitBtn').onclick = () => {
      sel.value = sel.dataset.prev || state.units[0];
      closeOverlay();
    };

    document.getElementById('saveUnitBtn').onclick = () => {
      let newUnit = input.value.trim();
      
      if (newUnit === '') {
        alert('Unit name cannot be empty.');
        return;
      }
      if (newUnit.length > 20) {
        alert('Unit name cannot exceed 20 characters.');
        return;
      }
      
      const exists = state.units.find(u => u.toLowerCase() === newUnit.toLowerCase());
      if (exists) {
        alert('This unit already exists.');
        sel.innerHTML = getUnitOptions(exists);
        sel.value = exists;
        sel.dataset.prev = exists;
        closeOverlay();
        return;
      }
      
      state.units.push(newUnit);
      saveState();
      
      sel.innerHTML = getUnitOptions(newUnit);
      sel.value = newUnit;
      sel.dataset.prev = newUnit;
      
      closeOverlay();
    };

    // Support Enter key submission
    input.onkeydown = (e) => {
      if (e.key === 'Enter') document.getElementById('saveUnitBtn').click();
    };
    
  } else {
    sel.dataset.prev = sel.value;
  }
}

// ─── Add/Edit Item Modal ──────────────────────────────────────────────────────
function openAddItem(){
  showModal('Add New Item', `
    <div class="form-group">
      <label class="form-label">Item Name *</label>
      <input type="text" id="itemName" placeholder="Item name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="itemCat" onfocus="this.dataset.prev=this.value" onchange="handleCatChange(this)">
          ${getCategoryOptions()}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Unit</label>
        <select id="itemUnit" onfocus="this.dataset.prev=this.value" onchange="handleUnitChange(this)">
          ${getUnitOptions()}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Buying Price (${state.shop.currency}) *</label>
        <input type="number" id="itemBuyPrice" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Selling Price (${state.shop.currency}) *</label>
        <input type="number" id="itemPrice" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Initial Stock</label>
      <input type="number" id="itemQty" placeholder="0" min="0" step="0.01">
    </div>
    <button class="btn-primary" style="width:100%;" onclick="saveItem(null)">✅ Add Item</button>
  `);
}

function openEditItem(id){
  const item = state.items.find(i => i.id === id);
  showModal('Edit Item', `
    <div class="form-group">
      <label class="form-label">Item Name *</label>
      <input type="text" id="itemName" value="${item.name}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="itemCat" onfocus="this.dataset.prev=this.value" onchange="handleCatChange(this)">
          ${getCategoryOptions(item.category)}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Unit</label>
        <select id="itemUnit" onfocus="this.dataset.prev=this.value" onchange="handleUnitChange(this)">
          ${getUnitOptions(item.unit)}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Buying Price (${state.shop.currency}) *</label>
        <input type="number" id="itemBuyPrice" value="${item.buyPrice}" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Selling Price (${state.shop.currency}) *</label>
        <input type="number" id="itemPrice" value="${item.price}" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Current Stock</label>
      <input type="number" id="itemQty" value="${item.qty}" min="0" step="0.01">
    </div>
    <button class="btn-primary" style="width:100%;" onclick="saveItem('${id}')">💾 Save Changes</button>
  `);
}

function saveItem(id){
  const name = document.getElementById('itemName').value.trim();
  const buyPriceInput = document.getElementById('itemBuyPrice').value;
  const priceInput = document.getElementById('itemPrice').value;
  const qtyInput = document.getElementById('itemQty').value;

  const buyPrice = parseFloat(buyPriceInput);
  const price = parseFloat(priceInput);
  const qty = parseFloat(qtyInput) || 0;

  // Validation
  if(!name){ alert('Item name is required'); return; }
  if(buyPriceInput === '' || isNaN(buyPrice) || buyPrice < 0){ alert('Valid Buying Price is required and cannot be negative'); return; }
  if(priceInput === '' || isNaN(price) || price < 0){ alert('Valid Selling Price is required and cannot be negative'); return; }
  if(qty < 0){ alert('Stock cannot be negative'); return; }
  
  if(buyPrice > price) {
    if(!confirm('Warning: Buying Price is greater than Selling Price. Do you want to continue?')) {
      return;
    }
  }

  if(id){
    const item = state.items.find(i => i.id === id);
    const oldQty = item.qty;
    item.name = name;
    item.category = document.getElementById('itemCat').value;
    item.unit = document.getElementById('itemUnit').value;
    item.buyPrice = buyPrice;
    item.price = price;
    item.qty = qty;

    if(qty !== oldQty){
      state.logs.push({id:uid(),type:qty>oldQty?'in':'out',itemId:id,itemName:name,qty:Math.abs(qty-oldQty),notes:'Manual adjustment',date:new Date().toISOString()});
    }
  } else {
    const newItem = {
      id: uid(),
      name,
      category: document.getElementById('itemCat').value,
      unit: document.getElementById('itemUnit').value,
      buyPrice,
      price,
      qty
    };
    state.items.push(newItem);
    if(qty > 0) state.logs.push({id:uid(),type:'in',itemId:newItem.id,itemName:name,qty,notes:'Initial stock',date:new Date().toISOString()});
  }
  
  saveState();
  closeModal();
  renderSection('stock');
  toast(id ? '✅ Item updated' : '✅ Item added');
}

function deleteItem(id){
  if(!confirm('Delete this item?')) return;
  state.items = state.items.filter(i => i.id !== id);
  saveState();
  renderSection('stock');
  toast('🗑 Item deleted');
}

// ─── Bill ────────────────────────────────────────────────────────────────────
let billItems = [];
let billCustomer = {name:'', phone:''};

function renderBill(c){
  const subtotal = billItems.reduce((s,bi) => s + bi.qty * bi.price, 0);
  const tax = subtotal * state.shop.taxRate / 100;
  const total = subtotal + tax;

  c.innerHTML = `
  <div class="fade-in">
    <div class="card">
      <h3 style="margin-bottom:12px;">Customer Details</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" id="custName" placeholder="Customer name" value="${billCustomer.name}" oninput="billCustomer.name=this.value">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="custPhone" placeholder="Phone no." value="${billCustomer.phone}" oninput="billCustomer.phone=this.value">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Bill Items</h3>
        <button class="btn-sm btn-primary" onclick="addBillItem()">➕ Add</button>
      </div>
      <div id="billItemsList">
        ${billItems.length === 0 ? '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">Tap ➕ Add to add items</div>' :
          billItems.map((bi, idx) => `
            <div class="bill-item-row">
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">📦 ${bi.name}</div>
                <div style="font-size:11px;color:var(--text-muted);">${state.shop.currency}${bi.price.toFixed(2)} each</div>
              </div>
              <input type="number" min="0.01" step="0.01" value="${bi.qty}" style="width:65px;text-align:center;" onchange="updateBillQty(${idx},this.value)">
              <div style="min-width:65px;text-align:right;font-weight:600;font-size:14px;">${state.shop.currency}${(bi.qty*bi.price).toFixed(2)}</div>
              <button onclick="removeBillItem(${idx})" style="background:var(--danger);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;">✕</button>
            </div>
          `).join('')
        }
      </div>

      ${billItems.length > 0 ? `
      <div class="bill-summary">
        <div class="summary-row"><span>Subtotal</span><span>${state.shop.currency}${subtotal.toFixed(2)}</span></div>
        ${state.shop.taxRate > 0 ? `<div class="summary-row"><span>Tax (${state.shop.taxRate}%)</span><span>${state.shop.currency}${tax.toFixed(2)}</span></div>` : ''}
        <div class="summary-row summary-total"><span>Total</span><span>${state.shop.currency}${total.toFixed(2)}</span></div>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:12px;padding:14px;font-size:16px;" onclick="generateBill()">🧾 Generate Bill</button>
      ` : ''}
    </div>
  </div>`;
}

function addBillItem(){
  if(state.items.length === 0){ alert('No items in inventory. Add items first.'); return; }
  showModal('Add Item to Bill', `
    <div class="form-group">
      <label class="form-label">Select Item</label>
      <select id="billItemSel" onchange="updateBillItemPrice(this.value)">
        <option value="">Choose item...</option>
        ${state.items.map(i => `<option value="${i.id}" data-price="${i.price}">📦 ${i.name} — ${state.shop.currency}${i.price.toFixed(2)} (${i.qty} ${i.unit})</option>`).join('')}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Quantity</label>
        <input type="number" id="billItemQty" value="1" min="0.01" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Price (${state.shop.currency})</label>
        <input type="number" id="billItemPrice" value="" placeholder="Auto" min="0" step="0.01">
      </div>
    </div>
    <button class="btn-primary" style="width:100%;" onclick="confirmAddBillItem()">➕ Add to Bill</button>
  `);
}

function updateBillItemPrice(id){
  const sel = document.getElementById('billItemSel');
  const opt = sel.options[sel.selectedIndex];
  if(opt && opt.dataset.price) document.getElementById('billItemPrice').value = opt.dataset.price;
}

function confirmAddBillItem(){
  const sel = document.getElementById('billItemSel');
  const itemId = sel.value;
  if(!itemId){ alert('Please select an item'); return; }
  const item = state.items.find(i => i.id === itemId);
  const qty = parseFloat(document.getElementById('billItemQty').value) || 1;
  const price = parseFloat(document.getElementById('billItemPrice').value) || item.price;
  const existing = billItems.findIndex(bi => bi.itemId === itemId);
  if(existing >= 0){
    billItems[existing].qty += qty;
  } else {
    billItems.push({itemId, name:item.name, unit:item.unit, qty, price});
  }
  closeModal();
  renderSection('bill');
}

function updateBillQty(idx, val){
  billItems[idx].qty = parseFloat(val) || 0;
  renderSection('bill');
}

function removeBillItem(idx){
  billItems.splice(idx, 1);
  renderSection('bill');
}

function generateBill(){
  if(billItems.length === 0){ alert('Add items to the bill'); return; }
  const subtotal = billItems.reduce((s,bi) => s + bi.qty * bi.price, 0);
  const tax = subtotal * state.shop.taxRate / 100;
  const total = subtotal + tax;
  const now = new Date();
  const billNo = state.nextBillNo++;

  // deduct stock
  billItems.forEach(bi => {
    const item = state.items.find(i => i.id === bi.itemId);
    if(item){ item.qty = Math.max(0, parseFloat((item.qty - bi.qty).toFixed(3))); }
  });

  const bill = {
    id: uid(),
    billNo,
    customerName: billCustomer.name,
    customerPhone: billCustomer.phone,
    items: [...billItems],
    subtotal, tax, total,
    taxRate: state.shop.taxRate,
    date: now.toISOString()
  };
  state.bills.push(bill);
  state.logs.push({id:uid(),type:'bill',billNo,items:billItems.map(b=>b.name).join(', '),total,date:now.toISOString()});
  saveState();

  billItems = [];
  billCustomer = {name:'', phone:''};

  showBillReceipt(bill);
}

function showBillReceipt(bill){
  const receiptHtml = buildReceipt(bill);
  showModal(`Bill #${bill.billNo}`, `
    ${receiptHtml}
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn-primary" style="flex:1;" onclick="printBill('${bill.id}')">🖨 Print</button>
      <button class="btn-secondary" style="flex:1;" onclick="closeModal();showSection('bill')">✅ Done</button>
    </div>
    <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:10px;">Print to a 3.5" / 80mm thermal printer</div>
  `);
}

function buildReceipt(bill){
  const b = state.shop;
  const dt = new Date(bill.date);
  const dateStr = dt.toLocaleDateString('en-IN');
  const timeStr = dt.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
  return `
    <div class="receipt">
      <div class="receipt-center">
        ${b.logo ? `<img src="${b.logo}" class="receipt-logo" alt="logo">` : `<div class="receipt-logo-placeholder">SMS</div>`}
        <div style="font-weight:700;font-size:15px;">${b.name}</div>
        ${b.tagline ? `<div style="font-size:11px;">${b.tagline}</div>` : ''}
        ${b.address ? `<div style="font-size:10px;">${b.address}</div>` : ''}
        ${b.phone ? `<div style="font-size:10px;">📞 ${b.phone}</div>` : ''}
        ${b.gst ? `<div style="font-size:10px;">GST: ${b.gst}</div>` : ''}
      </div>
      <div class="receipt-divider"></div>
      <div class="receipt-row"><span>Bill No:</span><span>#${bill.billNo}</span></div>
      <div class="receipt-row"><span>Date:</span><span>${dateStr}</span></div>
      <div class="receipt-row"><span>Time:</span><span>${timeStr}</span></div>
      ${bill.customerName ? `<div class="receipt-row"><span>Customer:</span><span>${bill.customerName}</span></div>` : ''}
      ${bill.customerPhone ? `<div class="receipt-row"><span>Phone:</span><span>${bill.customerPhone}</span></div>` : ''}
      <div class="receipt-divider"></div>
      <div class="receipt-row" style="font-weight:700;"><span>Item</span><span>Qty x Price = Amt</span></div>
      <div class="receipt-divider"></div>
      ${bill.items.map(bi => `
        <div style="margin-bottom:4px;font-size:11px;">
          <div>${bi.name}</div>
          <div class="receipt-row"><span></span><span>${bi.qty} x ${b.currency}${bi.price.toFixed(2)} = ${b.currency}${(bi.qty*bi.price).toFixed(2)}</span></div>
        </div>
      `).join('')}
      <div class="receipt-divider"></div>
      <div class="receipt-row"><span>Subtotal</span><span>${b.currency}${bill.subtotal.toFixed(2)}</span></div>
      ${bill.tax > 0 ? `<div class="receipt-row"><span>Tax (${bill.taxRate}%)</span><span>${b.currency}${bill.tax.toFixed(2)}</span></div>` : ''}
      <div class="receipt-divider"></div>
      <div class="receipt-row" style="font-weight:700;font-size:15px;"><span>TOTAL</span><span>${b.currency}${bill.total.toFixed(2)}</span></div>
      <div class="receipt-divider"></div>
      <div class="receipt-center" style="font-size:11px;margin-top:6px;">Thank you for your visit!<br>Please come again 🙏</div>
    </div>
  `;
}

function printBill(billId){
  const bill = state.bills.find(b => b.id === billId);
  if(!bill) return;
  const receiptHtml = buildReceipt(bill);
  const pa = document.getElementById('printArea');
  pa.innerHTML = `
    <style>
      @media print{
        body { margin: 0; }
        .print-area { width: 80mm; font-family: 'Courier New', monospace; }
        .receipt { padding: 4mm; font-size: 11px; }
        .receipt-divider { border-top: 1px dashed #000; margin: 4px 0; }
        .receipt-center { text-align: center; }
        .receipt-row { display: flex; justify-content: space-between; font-size: 11px; }
        .receipt-logo { width: 15mm; height: 15mm; }
        .receipt-logo-placeholder { width: 15mm; height: 15mm; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 4px; }
        button, .bottomnav, .topbar { display: none !important; }
      }
    </style>
    ${receiptHtml}`;
  pa.style.display = 'block';
  setTimeout(() => { window.print(); pa.style.display = 'none'; }, 100);
}

// ─── History ─────────────────────────────────────────────────────────────────
function renderHistory(c){
  c.innerHTML = `
  <div class="fade-in">
    <div class="tabs">
      <button class="tab active" id="hTab-bills" onclick="switchHistoryTab('bills')">Bills</button>
      <button class="tab" id="hTab-logs" onclick="switchHistoryTab('logs')">Stock Log</button>
    </div>
    <div id="historyContent"></div>
  </div>`;
  renderHistoryBills();
}

function switchHistoryTab(t){
  document.querySelectorAll('[id^="hTab-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('hTab-' + t).classList.add('active');
  if(t === 'bills') renderHistoryBills();
  else renderHistoryLogs();
}

function renderHistoryBills(){
  const hc = document.getElementById('historyContent');
  if(state.bills.length === 0){
    hc.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧾</div><p>No bills generated yet</p></div>';
    return;
  }
  hc.innerHTML = [...state.bills].reverse().map(b => `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-weight:700;font-size:15px;">#${b.billNo}</div>
          <div style="font-size:12px;color:var(--text-muted);">${b.customerName||'Walk-in'} ${b.customerPhone ? '· '+b.customerPhone : ''}</div>
          <div style="font-size:11px;color:var(--text-light);">${formatDateFull(b.date)}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${b.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:17px;font-weight:700;color:var(--brown);">${state.shop.currency}${b.total.toFixed(2)}</div>
          <button class="btn-sm btn-secondary" style="margin-top:6px;" onclick="viewBill('${b.id}')">🧾 View</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderHistoryLogs(){
  const hc = document.getElementById('historyContent');
  const logs = [...state.logs].reverse();
  if(logs.length === 0){
    hc.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No activity yet</p></div>';
    return;
  }
  hc.innerHTML = logs.map(l => `
    <div class="log-entry ${l.type==='in'?'in':l.type==='out'?'out':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:14px;font-weight:600;">
            ${l.type==='in'?'📥':l.type==='out'?'📤':'🧾'} 
            ${l.type==='bill' ? `Bill #${l.billNo}` : `${l.itemName} (${l.type==='in'?'+':'-'}${l.qty})`}
          </div>
          ${l.supplier?`<div style="font-size:11px;color:var(--text-muted);">Supplier: ${l.supplier}</div>`:''}
          ${l.reason?`<div style="font-size:11px;color:var(--text-muted);">Reason: ${l.reason}</div>`:''}
          ${l.notes?`<div style="font-size:11px;color:var(--text-muted);">${l.notes}</div>`:''}
          ${l.items?`<div style="font-size:11px;color:var(--text-muted);">${l.items}</div>`:''}
        </div>
        <div style="text-align:right;">
          ${l.total ? `<div style="font-weight:700;color:var(--brown);">${state.shop.currency}${l.total.toFixed(2)}</div>` : ''}
          <div class="log-time">${formatDateFull(l.date)}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function viewBill(id){
  const bill = state.bills.find(b => b.id === id);
  if(!bill) return;
  showModal(`Bill #${bill.billNo}`, `
    ${buildReceipt(bill)}
    <button class="btn-primary" style="width:100%;margin-top:16px;" onclick="printBill('${bill.id}')">🖨 Print (3.5" Thermal)</button>
  `);
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function renderSettings(c){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  c.innerHTML = `
  <div class="fade-in">
    <div class="card">
      <h3 style="margin-bottom:14px;">🏪 Shop Profile</h3>
      
      <div class="form-group" style="text-align:center;">
        <label class="form-label">Shop Logo</label>
        <div class="logo-upload" onclick="document.getElementById('logoFile').click()">
          ${state.shop.logo ? `<img src="${state.shop.logo}" class="logo-preview" alt="logo">` : `<div style="font-size:48px;margin-bottom:8px;">SMS</div>`}
          <div style="font-size:13px;color:var(--text-muted);">Tap to upload logo</div>
          <div style="font-size:11px;color:var(--text-light);margin-top:4px;">Appears on bills & receipt</div>
        </div>
        <input type="file" id="logoFile" accept="image/*" style="display:none;" onchange="uploadLogo(this)">
        ${state.shop.logo ? `<button class="btn-sm btn-secondary" style="margin-top:8px;" onclick="state.shop.logo=null;saveState();renderSection('settings')">✕ Remove Logo</button>` : ''}
      </div>

      <div class="form-group">
        <label class="form-label">Shop Name *</label>
        <input type="text" id="setName" value="${state.shop.name}" placeholder="Your shop Name">
      </div>
      <div class="form-group">
        <label class="form-label">Tagline</label>
        <input type="text" id="setTagline" value="${state.shop.tagline}" placeholder="Fresh & Delicious">
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <textarea id="setAddress" rows="2">${state.shop.address}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="setPhone" value="${state.shop.phone}" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">GST Number</label>
          <input type="text" id="setGst" value="${state.shop.gst}" placeholder="Optional">
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;">⚙ App Settings</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Currency Symbol</label>
          <select id="setCurrency">
            ${['₹','$','€','£','¥','₵'].map(c => `<option ${state.shop.currency===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tax Rate (%)</label>
          <input type="number" id="setTax" value="${state.shop.taxRate}" min="0" max="100" step="0.1">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Low Stock Alert (qty below)</label>
        <input type="number" id="setLowStock" value="${state.shop.lowStockAlert}" min="0">
      </div>
    </div>

    <button class="btn-primary" style="width:100%;padding:14px;font-size:16px;" onclick="saveSettings()">💾 Save Settings</button>

    <div class="card" style="margin-top:16px;">
      <h3 style="margin-bottom:10px;color:var(--danger);">⚠ Danger Zone</h3>
      <button class="btn-danger btn-sm" onclick="clearAllData()" style="width:100%;">🗑 Clear All Data</button>
    </div>

    <div style="text-align:center;padding:20px;color:var(--text-light);font-size:12px;">
      Bumblebee
    </div>
  </div>`;
}

function uploadLogo(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    state.shop.logo = e.target.result;
    saveState();
    renderSection('settings');
    updateTopbar();
  };
  reader.readAsDataURL(file);
}

function saveSettings(){
  state.shop.name = document.getElementById('setName').value.trim() || 'My shop';
  state.shop.tagline = document.getElementById('setTagline').value.trim();
  state.shop.address = document.getElementById('setAddress').value.trim();
  state.shop.phone = document.getElementById('setPhone').value.trim();
  state.shop.gst = document.getElementById('setGst').value.trim();
  state.shop.currency = document.getElementById('setCurrency').value;
  state.shop.taxRate = parseFloat(document.getElementById('setTax').value) || 0;
  state.shop.lowStockAlert = parseInt(document.getElementById('setLowStock').value) || 5;
  saveState();
  updateTopbar();
  toast('✅ Settings saved');
  showSection('dashboard');
}

function clearAllData(){
  if(!confirm('This will delete all items, bills, and history. Are you sure?')) return;
  if(!confirm('Last chance — really delete everything?')) return;
  
  state.items = []; 
  state.bills = []; 
  state.logs = []; 
  state.nextBillNo = 1001; 
  state.categories = [];
  state.units = [];
  
  saveState();
  toast('🗑 All data cleared');
  renderSection('dashboard');
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function showModal(title, body){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(e){
  if(e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
}

// ─── Utility ──────────────────────────────────────────────────────────────────
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short'});
}
function formatDateFull(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'2-digit'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
}

function openStockIn(){ showSection('stock'); stockTab='in'; renderSection('stock'); }
function openStockOut(){ showSection('stock'); stockTab='out'; renderSection('stock'); }

let toastTimer;
function toast(msg){
  let t = document.getElementById('toastMsg');
  if(!t){ t = document.createElement('div'); t.id='toastMsg'; t.style=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;white-space:nowrap;`; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = '0', 2000);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
updateTopbar();
showSection('dashboard');

// PWA install hint
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  const btn = document.createElement('div');
  btn.style = 'position:fixed;top:60px;left:0;right:0;background:var(--brown);color:#fff;text-align:center;padding:10px;font-size:13px;z-index:150;cursor:pointer;';
  btn.textContent = '📲 Install app on your phone — tap here';
  btn.onclick = () => { e.prompt(); btn.remove(); };
  document.body.appendChild(btn);
  setTimeout(() => btn.remove(), 8000);
});
</script>
</body>
</html>
