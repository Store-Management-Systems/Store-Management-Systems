<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>STORE MANAGEMENT SYSTEMS — Enterprise SaaS ERP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</head>

<body>

  <!-- Floating Toast Notifications Container -->
  <div id="toastContainer"></div>

  <!-- Main Application UI -->
  <div id="app" style="display:none;">

    <!-- Enterprise Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="#" class="sidebar-brand" onclick="showSection('dashboard'); return false;">
          <img src="logo.png" alt="SMS Logo" id="sidebarLogoImg">
          <span class="sidebar-brand-name">STORE SYSTEMS</span>
        </a>
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          ⚡
        </button>
      </div>

      <div class="sidebar-search">
        <input type="text" placeholder="Search menu..." onkeyup="filterSidebarMenu(this.value)">
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="sidebar-nav-item active" id="side-dashboard" onclick="showSection('dashboard')">
          <span class="sidebar-nav-icon">📊</span>
          <span class="sidebar-nav-text">Dashboard</span>
        </button>
        <button class="sidebar-nav-item" id="side-people" onclick="showSection('people')">
          <span class="sidebar-nav-icon">👥</span>
          <span class="sidebar-nav-text">Parties & Customers</span>
        </button>
        <button class="sidebar-nav-item" id="side-stock" onclick="showSection('stock')">
          <span class="sidebar-nav-icon">📦</span>
          <span class="sidebar-nav-text">Inventory Stock</span>
        </button>
        <button class="sidebar-nav-item" id="side-bill" onclick="showSection('bill')">
          <span class="sidebar-nav-icon">🧾</span>
          <span class="sidebar-nav-text">POS Billing</span>
        </button>
        <button class="sidebar-nav-item" id="side-analytics" onclick="showSection('analytics')">
          <span class="sidebar-nav-icon">📈</span>
          <span class="sidebar-nav-text">Financial Analytics</span>
        </button>
        <button class="sidebar-nav-item" id="side-history" onclick="showSection('history')">
          <span class="sidebar-nav-icon">📋</span>
          <span class="sidebar-nav-text">Audit History</span>
        </button>
        <button class="sidebar-nav-item" id="side-settings" onclick="showSection('settings')">
          <span class="sidebar-nav-icon">⚙️</span>
          <span class="sidebar-nav-text">Settings</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">

      <!-- Top Bar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
          <div class="topbar-breadcrumbs" id="topbarBreadcrumbs">
            <span>Store</span> / <span class="active" id="currentSectionTitle">Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Global Search -->
          <div class="global-search-wrapper">
            <span class="global-search-icon">🔍</span>
            <input type="text" class="global-search-input" placeholder="Quick Search... (Ctrl+K)" id="globalSearchInput"
              onkeydown="handleGlobalSearchKey(event)">
            <span class="global-search-shortcut">⌘K</span>
          </div>

          <!-- Admin Branch Selector -->
          <div id="topbarAdminShopSelect" style="display:none;margin-right:4px;">
            <select id="adminShopDropdown" onchange="handleAdminShopSwitch(this.value)"
              style="padding:6px 12px;font-size:12px;max-width:160px;border-radius:10px;">
            </select>
          </div>

          <!-- Pending Approvals Badge -->
          <button onclick="openApprovalsModal()" id="btnTopApprovals" title="Pending Approvals"
            style="background:rgba(245,158,11,0.2);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);padding:0 12px;height:36px;border-radius:18px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">
            🛡 Approvals
          </button>

          <!-- Reports Export Modal -->
          <button onclick="openReportsModal()" title="Export Reports" class="theme-toggle-btn">📊</button>

          <!-- Light / Dark Theme Switcher -->
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleAppTheme()"
            title="Switch Light/Dark Theme">
            🌙
          </button>

          <!-- User Profile Pill -->
          <div class="user-profile-pill" onclick="handleLogout()" title="Click to Sign Out">
            <div class="user-avatar-circle" id="userAvatarCircle">A</div>
            <div class="user-pill-info">
              <span class="user-pill-name" id="userPillName">Admin</span>
              <span class="user-pill-role" id="userPillRole">SUPER ADMIN</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Section Main View Target Container -->
      <main class="content" id="mainContent"></main>

    </div>

    <!-- Mobile Floating Navigation Bar -->
    <div class="bottomnav" id="bottomNav">
      <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')">
        <span class="nav-icon">📊</span>Dashboard
      </button>
      <button class="nav-btn" id="nav-people" onclick="showSection('people')">
        <span class="nav-icon">👥</span>People
      </button>
      <button class="nav-btn" id="nav-stock" onclick="showSection('stock')">
        <span class="nav-icon">📦</span>Stock
      </button>
      <button class="nav-btn" id="nav-bill" onclick="showSection('bill')">
        <span class="nav-icon">🧾</span>Bill
      </button>
      <button class="nav-btn" id="nav-analytics" onclick="showSection('analytics')">
        <span class="nav-icon">📈</span>Analytics
      </button>
      <button class="nav-btn" id="nav-history" onclick="showSection('history')">
        <span class="nav-icon">📋</span>History
      </button>
    </div>

  </div>

  <!-- Glassmorphic Login Overlay Screen -->
  <div id="loginScreen" class="login-overlay">
    <div class="login-bg-glow-1"></div>
    <div class="login-bg-glow-2"></div>

    <div class="login-card fade-in" id="loginCardContainer">
      <div class="login-logo" id="loginLogo">
        <img src="logo.png" alt="SMS Logo">
      </div>
      <h2 class="login-title" id="loginShopName">STORE MANAGEMENT SYSTEMS</h2>
      <p class="login-subtitle">Version - UAT</p>

      <form id="loginForm" action="javascript:void(0);" onsubmit="handleLoginSubmit(event); return false;">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="loginUsername" placeholder="" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="loginPassword" placeholder="" required autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility()"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;font-size:12px;padding:4px;font-weight:700;cursor:pointer;">
              👁 Show
            </button>
          </div>
        </div>

        <div
          style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;color:#94a3b8;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="rememberMe" checked style="width:auto;accent-color:#3b82f6;"> Remember Me
          </label>
          <span style="color:#3b82f6;cursor:pointer;font-weight:600;"
            onclick="showToast('Password Reset', 'Contact system support at 9090684957 to reset credentials', 'info')">Forgot
            Password?</span>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;padding:14px;font-size:15px;">
          🔐 Sign In
        </button>
      </form>

      <div
        style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:12px;color:#94a3b8;text-align:center;">
        Contact Enterprise Support: <strong style="color:#3b82f6;">9090684957</strong>
      </div>
    </div>
  </div>

  <!-- Reusable Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <div class="modal-header"
        style="padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;">
        <h2 id="modalTitle" style="font-size:18px;font-weight:700;">Modal</h2>
        <button class="modal-close" onclick="closeModal()"
          style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-secondary);">✕</button>
      </div>
      <div id="modalBody" style="padding:20px;"></div>
    </div>
  </div>

  <!-- Thermal Print Container (Hidden) -->
  <div id="printArea" class="print-area" style="display:none;"></div>

  <script src="script.js"></script>
</body>

</html>
