<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Store Management Systems</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Authentication Overlay -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card glass-panel fade-in">
    <h2>Store Management Systems</h2>
    <p>Sign in to your account</p>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="loginUsername" placeholder="">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="loginPassword" placeholder="">
    </div>
    <button class="btn-primary w-100" onclick="handleLogin()">Login</button>
  </div>
</div>

<div id="app" style="display:none;">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo" id="topbarLogo">SMS</div>
    <div class="topbar-title" id="topbarTitle">Shop Management</div>
    <select id="adminShopSelector" onchange="changeActiveShop(this.value)" style="display:none; width: 140px; margin-right:10px; padding: 4px; border-radius:4px; font-size:12px;"></select>
    <button onclick="logout()" class="btn-sm btn-danger" style="margin-right:10px;">Logout</button>
    <button onclick="showSection('settings')" data-perm="Settings" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;">⚙</button>
  </div>

  <div class="content" id="mainContent"></div>

  <!-- Bottom Nav -->
  <div class="bottomnav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showSection('dashboard')" data-perm="Dashboard">
      <span class="nav-icon">📊</span>Dashboard
    </button>
    <button class="nav-btn" id="nav-pos" onclick="showSection('pos')" data-perm="Billing">
      <span class="nav-icon">🛒</span>POS Billing
    </button>
    <button class="nav-btn" id="nav-stock" onclick="showSection('stock')" data-perm="Inventory">
      <span class="nav-icon">📦</span>Stock
    </button>
    <button class="nav-btn" id="nav-reports" onclick="showSection('reports')" data-perm="Reports">
      <span class="nav-icon">📈</span>Reports
    </button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal"><div class="modal-header"><h2 id="modalTitle"></h2><button class="modal-close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
</div>

<script src="script.js"></script>
</body>
</html>
